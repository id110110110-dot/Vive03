<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>테트리스</title>
  <style>
    :root {
      --bg: #111;
      --panel: #171717;
      --border: #444;
      --text: #f5f5f5;
      --accent: #ff5454;
      --block-size: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #333 0%, #090909 50%, #050505 100%);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    .container {
      display: grid;
      grid-template-columns: auto 240px;
      gap: 24px;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      background: rgba(15, 15, 15, 0.92);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }

    .board {
      position: relative;
      width: calc(var(--block-size) * 10);
      height: calc(var(--block-size) * 20);
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.08));
      border: 2px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.45);
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 100%;
    }

    .panel {
      padding: 18px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02);
    }

    .panel h1,
    .panel h2,
    .panel p {
      margin-bottom: 12px;
    }

    h1 {
      font-size: 1.35rem;
      letter-spacing: 0.05em;
    }

    h2 {
      font-size: 1rem;
      margin-top: 8px;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat {
      padding: 14px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      text-align: center;
    }

    .stat strong {
      display: block;
      margin-bottom: 8px;
      font-size: 1.05rem;
      color: var(--accent);
    }

    .next-piece {
      width: 100%;
      height: calc(var(--block-size) * 6);
      background: rgba(0, 0, 0, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      position: relative;
      overflow: hidden;
    }

    .next-piece canvas {
      width: 100%;
      height: 100%;
    }

    .instructions {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #ccc;
    }

    .instructions code {
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 0.92rem;
      color: #fff;
    }

    .warning {
      margin-top: 12px;
      color: #f08;
      font-size: 0.92rem;
    }

    .footer {
      margin-top: 8px;
      font-size: 0.85rem;
      opacity: 0.7;
    }

    @media (max-width: 880px) {
      .container {
        grid-template-columns: 1fr;
      }

      .sidebar {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <section class="board">
      <canvas id="gameCanvas" width="240" height="480"></canvas>
    </section>

    <aside class="sidebar">
      <section class="panel">
        <h1>테트리스</h1>
        <div class="stats">
          <div class="stat">
            <strong id="score">0</strong>
            점수
          </div>
          <div class="stat">
            <strong id="level">1</strong>
            레벨
          </div>
          <div class="stat">
            <strong id="lines">0</strong>
            제거
          </div>
          <div class="stat">
            <strong id="speed">1</strong>
            속도
          </div>
        </div>
      </section>

      <section class="panel">
        <h2>다음 블록</h2>
        <div class="next-piece">
          <canvas id="nextCanvas" width="144" height="144"></canvas>
        </div>
      </section>

      <section class="panel instructions">
        <h2>조작</h2>
        <p><code>←</code> / <code>→</code> : 좌우 이동</p>
        <p><code>↑</code> : 회전</p>
        <p><code>↓</code> : 빠른 낙하</p>
        <p><code>Space</code> : 하드 드롭</p>
        <p class="warning">게임 시작 후 키보드를 눌러 플레이하세요.</p>
      </section>

      <section class="footer">
        <div>HTML5 · CSS3 · JavaScript</div>
        <div>Refresh to restart the game.</div>
      </section>
    </aside>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const context = canvas.getContext("2d");
    const nextCanvas = document.getElementById("nextCanvas");
    const nextCtx = nextCanvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const levelEl = document.getElementById("level");
    const linesEl = document.getElementById("lines");
    const speedEl = document.getElementById("speed");

    const COLS = 10;
    const ROWS = 20;
    const BLOCK = 24;
    const COLORS = [
      null,
      "#00ffff",
      "#ffcc00",
      "#ff6d00",
      "#00c8ff",
      "#ff2d95",
      "#7cff00",
      "#9d00ff"
    ];

    const SHAPES = [
      [],
      [[1, 1, 1, 1]],
      [[2, 0, 0], [2, 2, 2]],
      [[0, 0, 3], [3, 3, 3]],
      [[4, 4], [4, 4]],
      [[0, 5, 5], [5, 5, 0]],
      [[6, 6, 0], [0, 6, 6]],
      [[7, 7, 7], [0, 7, 0]]
    ];

    const arena = createMatrix(COLS, ROWS);
    let dropCounter = 0;
    let dropInterval = 1000;
    let lastTime = 0;
    let score = 0;
    let level = 1;
    let lines = 0;
    let gameOver = false;
    let currentPiece = createPiece();
    let nextPiece = createPiece();

    function createMatrix(w, h) {
      const matrix = [];
      while (h--) {
        matrix.push(new Array(w).fill(0));
      }
      return matrix;
    }

    function createPiece() {
      const index = Math.floor(Math.random() * (SHAPES.length - 1)) + 1;
      const matrix = SHAPES[index].map(row => [...row]);
      return {
        matrix,
        pos: { x: Math.floor(COLS / 2) - Math.ceil(matrix[0].length / 2), y: 0 },
        type: index
      };
    }

    function collide(arena, player) {
      const m = player.matrix;
      const o = player.pos;
      for (let y = 0; y < m.length; y++) {
        for (let x = 0; x < m[y].length; x++) {
          if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
            return true;
          }
        }
      }
      return false;
    }

    function merge(arena, player) {
      player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            arena[y + player.pos.y][x + player.pos.x] = value;
          }
        });
      });
    }

    function rotate(matrix, dir) {
      const rotated = matrix[0].map((_, x) => matrix.map(row => row[x]));
      if (dir > 0) {
        return rotated.map(row => row.reverse());
      }
      return rotated.reverse();
    }

    function playerDrop() {
      currentPiece.pos.y++;
      if (collide(arena, currentPiece)) {
        currentPiece.pos.y--;
        merge(arena, currentPiece);
        sweepLines();
        currentPiece = nextPiece;
        nextPiece = createPiece();
        if (collide(arena, currentPiece)) {
          gameOver = true;
        }
      }
      dropCounter = 0;
    }

    function playerMove(offset) {
      currentPiece.pos.x += offset;
      if (collide(arena, currentPiece)) {
        currentPiece.pos.x -= offset;
      }
    }

    function playerRotate(dir) {
      const posX = currentPiece.pos.x;
      let offset = 1;
      const originalMatrix = currentPiece.matrix;
      currentPiece.matrix = rotate(currentPiece.matrix, dir);
      while (collide(arena, currentPiece)) {
        currentPiece.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > currentPiece.matrix[0].length) {
          currentPiece.matrix = originalMatrix;
          currentPiece.pos.x = posX;
          return;
        }
      }
    }

    function sweepLines() {
      let rowCount = 0;
      outer: for (let y = arena.length - 1; y >= 0; y--) {
        for (let x = 0; x < arena[y].length; x++) {
          if (arena[y][x] === 0) {
            continue outer;
          }
        }

        const row = arena.splice(y, 1)[0].fill(0);
        arena.unshift(row);
        y++;
        rowCount++;
      }

      if (rowCount > 0) {
        score += rowCount * rowCount * 100;
        lines += rowCount;
        level = Math.min(10, Math.floor(lines / 10) + 1);
        dropInterval = Math.max(120, 1000 - (level - 1) * 90);
        updateStats();
      }
    }

    function hardDrop() {
      while (!collide(arena, currentPiece)) {
        currentPiece.pos.y++;
      }
      currentPiece.pos.y--;
      merge(arena, currentPiece);
      sweepLines();
      currentPiece = nextPiece;
      nextPiece = createPiece();
      if (collide(arena, currentPiece)) {
        gameOver = true;
      }
      dropCounter = 0;
    }

    function drawMatrix(matrix, offset, ctx) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            ctx.fillStyle = COLORS[value];
            ctx.fillRect(
              (x + offset.x) * BLOCK,
              (y + offset.y) * BLOCK,
              BLOCK - 1,
              BLOCK - 1
            );
          }
        });
      });
    }

    function draw() {
      context.clearRect(0, 0, canvas.width, canvas.height);
      context.fillStyle = "rgba(16, 16, 16, 0.86)";
      context.fillRect(0, 0, canvas.width, canvas.height);

      drawMatrix(arena, { x: 0, y: 0 }, context);
      drawMatrix(currentPiece.matrix, currentPiece.pos, context);

      if (gameOver) {
        context.fillStyle = "rgba(0, 0, 0, 0.75)";
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.fillStyle = "#fff";
        context.font = "24px sans-serif";
        context.textAlign = "center";
        context.fillText("게임 오버", canvas.width / 2, canvas.height / 2 - 12);
        context.font = "16px sans-serif";
        context.fillText("페이지를 새로고침하여 다시 시작하세요.", canvas.width / 2, canvas.height / 2 + 18);
      }
    }

    function drawNext() {
      nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
      nextCtx.fillStyle = "rgba(10, 10, 10, 0.95)";
      nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);

      const matrix = nextPiece.matrix;
      const offset = {
        x: Math.floor((6 - matrix[0].length) / 2),
        y: Math.floor((6 - matrix.length) / 2)
      };
      drawMatrix(matrix, offset, nextCtx);
    }

    function updateStats() {
      scoreEl.textContent = score;
      levelEl.textContent = level;
      linesEl.textContent = lines;
      speedEl.textContent = level;
    }

    function update(time = 0) {
      const deltaTime = time - lastTime;
      lastTime = time;
      dropCounter += deltaTime;

      if (!gameOver && dropCounter > dropInterval) {
        playerDrop();
      }

      draw();
      drawNext();
      if (!gameOver) {
        requestAnimationFrame(update);
      }
    }

    document.addEventListener("keydown", event => {
      if (gameOver) return;
      if (event.key === "ArrowUp" && event.repeat) return;
      if (event.key === "ArrowLeft") {
        playerMove(-1);
      } else if (event.key === "ArrowRight") {
        playerMove(1);
      } else if (event.key === "ArrowDown") {
        playerDrop();
      } else if (event.key === "ArrowUp") {
        playerRotate(1);
      } else if (event.code === "Space") {
        event.preventDefault();
        hardDrop();
      }
    });

    updateStats();
    update();
  </script>
</body>
</html>
